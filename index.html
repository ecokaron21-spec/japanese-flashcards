<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#214e52" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>日语词卡</title>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">大家的日语 初级 1</p>
      <div class="heading-row">
        <h1>今日词卡</h1>
        <button id="sound" class="icon-button" type="button" aria-label="朗读日语">🔊</button>
      </div>
      <p id="progress" class="progress">第 1 课 · 1 / 50</p>
    </header>

    <section class="mode-switch" aria-label="练习方向">
      <button class="mode active" data-mode="zh-ja" type="button">中译日</button>
      <button class="mode" data-mode="ja-zh" type="button">日译中</button>
    </section>
    <section class="study-options">
      <label>词库<select id="lesson-select"><option value="all">第 1–24 课</option><option value="1">第 1 课</option><option value="2">第 2 课</option><option value="3">第 3 课</option><option value="4">第 4 课</option><option value="5">第 5 课</option><option value="6">第 6 课</option><option value="7">第 7 课</option><option value="8">第 8 课</option><option value="9">第 9 课</option><option value="10">第 10 课</option><option value="11">第 11 课</option><option value="12">第 12 课</option><option value="13">第 13 课</option><option value="14">第 14 课</option><option value="15">第 15 课</option><option value="16">第 16 课</option><option value="17">第 17 课</option><option value="18">第 18 课</option><option value="19">第 19 课</option><option value="20">第 20 课</option><option value="21">第 21 课</option><option value="22">第 22 课</option><option value="23">第 23 课</option><option value="24">第 24 课</option></select></label>
      <label class="random-option"><input id="random-order" type="checkbox" /> 随机顺序</label>
    </section>
    <section class="quick-actions">
      <button id="review-cards" type="button">待复习 <span id="review-action-count">0</span></button>
      <label class="search-box"><input id="word-search" type="search" placeholder="查日文、假名或中文" autocomplete="off" /></label>
    </section>
    <section id="search-results" class="search-results hidden" aria-live="polite"></section>

    <section id="card" class="card" aria-live="polite">
      <p id="prompt-label" class="card-label">中文</p>
      <h2 id="prompt" class="prompt"></h2>
      <button id="reveal" class="reveal" type="button">显示答案</button>
      <div id="answer" class="answer hidden">
        <p id="answer-main" class="answer-main"></p>
        <p id="answer-detail" class="answer-detail"></p>
      </div>
      <p id="current-errors" class="current-errors">本词错误：0 次</p>
      <div class="answer-form">
        <input id="answer-input" autocomplete="off" placeholder="输入答案" />
        <button id="check-answer" type="button">核对</button>
      </div>
      <p id="check-result" class="check-result" aria-live="polite"></p>
    </section>

    <section class="grade-row" aria-label="记忆程度">
      <button data-grade="forgot" type="button">忘记了</button>
      <button data-grade="hard" type="button">模糊</button>
      <button data-grade="easy" type="button">认识</button>
    </section>
    <button id="next-card" class="next-card" type="button">下一个词</button>

    <section class="stats">
      <div><span id="known-count">0</span><small>已认识</small></div>
      <div><span id="review-count">0</span><small>待复习</small></div>
      <div><span>第 1 课</span><small>当前词库</small></div>
    </section>
  </main>
  <script src="data.v10.js"></script>
  <script src="lesson-11.js"></script>
  <script src="lesson-11-finalize.js"></script>
  <script src="lesson-12.js"></script>
  <script src="lesson-13.js"></script>
  <script src="lesson-14.js"></script>
  <script src="lesson-15.js"></script>
  <script src="lesson-16.js"></script>
  <script src="lesson-17.js"></script>
  <script src="lesson-18.js"></script>
  <script src="lesson-19.js"></script>
  <script src="lesson-20.js"></script>
  <script src="lesson-21.js"></script>
  <script src="lesson-22.js"></script>
  <script src="lesson-23.js"></script>
  <script src="lesson-24.js"></script>
  <script src="lesson-25.js"></script>
  <script src="lesson-25-select.js"></script>
  <script src="app.v10.js"></script>
</body>
</html>
